version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    assignees: [tayles]
    reviewers: [tayles]
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      oxc:
        patterns: ['oxfmt', 'oxlint', 'oxlint-tsgolint']
    ignore:
      # Pinned to 6.x on purpose: `astro check` needs the programmatic API that
      # TypeScript 7's native compiler does not expose yet. See AGENTS.md.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    assignees: [tayles]
    reviewers: [tayles]
